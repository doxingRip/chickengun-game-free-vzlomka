name: Build Portable Windows EXE

on:
  push:
    branches:
      - anti
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: p
      - name: Prepare product images
        shell: pwsh
        working-directory: p
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item -LiteralPath '8kihc_46Gx7ZwBbr86qgUio9kbNYAsBpCNDZNwo-5pWjII4S9SrgrehlkJhvtgLxS-NH3GVenpdQXJmurCzgLc2vOkzfuWxxZUQmf0zeQusWGXWhm9tcHV2ffBWQ_rYDJsVM-Esv6sPSeGhEwfK86s-3tHSCjVj2bSwueTRBTWqCnLj_xWYqaQEZFrb8UQfn.jfif' -Destination 'assets/rtx4090.jfif' -Force
          Copy-Item -LiteralPath 'hVEII9_s02XbKUdRtgBZiCmn69cI8h_pS_rEjviKQx2IWW_PIEs-DnPBFaS5WR0J4NeRd8ckQBdbHdzNgzm9muEYWtXihrsITYKsEFI2M7YeB9mWUBaNmTTGX4qLm7B2_H7DBic-tIdnWbv_dRpOJVF3fHd8w-sC3srqWV2kHqIinf-1m0qzohQbFQG6EZek.jfif' -Destination 'assets/monitor.jfif' -Force
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: p
        run: npm install
      - name: Build portable EXE
        working-directory: p
        run: npm run build:win
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChickenGun-Prank-Portable
          path: p/dist/ChickenGun-Prank-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
