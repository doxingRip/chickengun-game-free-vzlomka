name: Build Portable Windows EXE

on:
  push:
    branches:
      - anti
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build portable EXE
        run: npm run build:win
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChickenGun-Prank-Portable
          path: dist/ChickenGun-Prank-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
